<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<title>LATCHI IPTV</title>
<link rel="stylesheet" href="tv.css">
</head>
<body>

<!-- ═══ ⏳ v1.0.1: غطاء «جاري التحقق من الاشتراك» — فن التلفاز بالإطار الذهبي ═══ -->
<div id="checkingOv" class="checking-ov hidden"><img src="../assets/checking_tv.webp" alt=""></div>

<!-- ═══ 🎬 السبلاش ═══ -->
<div id="splash" class="screen active">
  <img class="splash-bg" src="../assets/splash_owner_tv.webp" alt="">
  <div class="splash-veil"></div>
  <div class="splash-brand">IPTV <span>LATCHI DZ</span></div>
  <div class="splash-ver">V1.0</div>
  <div class="splash-loading"><div class="spinner"></div><div class="splash-hint">جارٍ التشغيل…</div></div>
</div>

<!-- ═══ 🔑 شاشة التحقق ═══ -->
<div id="verify" class="screen">
  <img class="verify-bg" src="../assets/update_art.webp" alt="">
  <div class="verify-panel">
    <div class="verify-logo">IPTV <span>LATCHI DZ</span></div>
    <div class="verify-tabs">
      <button class="vtab active" data-tab="code">🔑 كود التفعيل</button>
      <button class="vtab" data-tab="m3u">🔗 رابط M3U</button>
    </div>
    <div id="vtab-code" class="vbody">
      <div class="input-row">
        <input id="codeInput" class="tv-input" type="text" placeholder="أدخل كود التفعيل هنا" autocomplete="off" spellcheck="false">
        <button class="paste-btn" data-paste="codeInput" title="لصق من الحافظة"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg></button>
      </div>
      <button id="codeBtn" class="gold-btn">✓ تحقق الآن</button>
    </div>
    <div id="vtab-m3u" class="vbody hidden">
      <div class="input-row">
        <input id="m3uInput" class="tv-input" type="text" placeholder="http://...playlist.m3u" autocomplete="off" spellcheck="false">
        <button class="paste-btn" data-paste="m3uInput" title="لصق من الحافظة"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg></button>
      </div>
      <button id="m3uBtn" class="gold-btn">⬇ حمّل القائمة</button>
    </div>
    <div id="verifyMsg" class="verify-msg"></div>
  </div>
</div>

<!-- ═══ 🏠 الرئيسية ═══ -->
<div id="home" class="screen">
  <div id="homeBgs"></div>
  <header class="tv-header glass">
    <div class="logo">LATCHI <span>IPTV</span> <em>VIP</em></div>
    <span class="ver-chip">V1.0</span>
    <div class="clock" id="clock"></div>
    <div class="user-chip" id="userChip">👤</div>
  </header>
  <div class="cards" id="cards"></div>
</div>

<!-- ═══ 📺 القوائم (بث/أفلام/مسلسلات) ═══ -->
<div id="list" class="screen">
  <header class="tv-header">
    <div class="back-btn nav-back">← رجوع</div>
    <div class="logo">LATCHI <span>IPTV</span></div>
    <input id="searchInput" class="search-input" type="text" placeholder="🔍 بحث...">
  </header>
  <div class="cats-bar" id="catsBar"></div>
  <div class="list-body" id="listBody"></div>
</div>

<!-- ═══ 🎬 التفاصيل ═══ -->
<div id="details" class="screen">
  <header class="tv-header">
    <div class="back-btn nav-back">← رجوع</div>
    <div class="logo">LATCHI <span>IPTV</span></div>
  </header>
  <div class="details-body" id="detailsBody"></div>
</div>

<!-- ═══ ⚙️ الإعدادات ═══ -->
<div id="settings" class="screen">
  <header class="tv-header">
    <div class="back-btn nav-back">← رجوع</div>
    <div class="logo">LATCHI <span>IPTV</span></div>
  </header>
  <div class="settings-body" id="settingsBody"></div>
</div>

<!-- ═══ 👤 مركز الحسابات (مثل الهاتف: كود أو M3U مباشر + تبديل) ═══ -->
<div id="accounts" class="screen">
  <header class="tv-header">
    <div class="back-btn nav-back">← رجوع</div>
    <div class="logo">LATCHI <span>IPTV</span> <em>VIP</em></div>
  </header>
  <div class="settings-body" id="accountsBody"></div>
</div>

<!-- ═══ 👋 v1.0.1: شاشة الترحيب «مرحبا بك في عائلة لاتشي» ═══ -->
<div id="welcome" class="screen">
  <img class="welcome-bg" src="../assets/welcome_tv.webp" alt="">
</div>

<!-- ═══ ▶️ المشغل ═══ -->
<div id="player" class="screen">
  <video id="video" autoplay></video>
  <div class="player-ui" id="playerUi">
    <div class="p-top">
      <div class="p-name" id="pName"></div>
      <div class="p-live-badge hidden" id="pLive">● مباشر</div>
      <div class="p-time" id="pTime"></div>
    </div>
    <div class="p-seek" id="pSeekWrap">
      <div class="p-seek-track"><div class="p-seek-fill" id="pSeekFill"></div></div>
    </div>
    <div class="p-controls">
      <button class="p-btn" id="pPlay">⏸</button>
      <button class="p-btn" id="pRew">⏪ -10ث</button>
      <button class="p-btn" id="pFwd">⏩ +10ث</button>
      <button class="p-btn" id="pVol">🔊</button>
      <button class="p-btn" id="pFull">⛶ ملء الشاشة</button>
      <button class="p-btn" id="pFav">☆ مفضلة</button>
      <button class="p-btn p-exit" id="pExit">✕ خروج</button>
    </div>
    <div class="p-hint">مسافة: تشغيل/إيقاف • أسهم: تنقل/صوت • F: ملء الشاشة • Esc: رجوع</div>
  </div>
  <div class="p-center-msg hidden" id="pCenter"></div>
</div>

<script src="../node_modules/hls.js/dist/hls.min.js"></script>
<script src="api.js"></script>
<script src="player.js"></script>
<script src="app.js"></script>
</body>
</html>
